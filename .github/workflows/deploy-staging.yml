name: Deploy Staging

on:
  push:
    branches:
      - develop

concurrency:
  group: staging-deployment
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Publish Staging Image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - uses: docker/build-push-action@v6
        id: push
        with:
          context: .
          push: true
          tags: ghcr.io/devsanghavi/gitops-cicd-pipeline:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy Staging to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    env:
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      EC2_PUBLIC_IP: ${{ vars.EC2_PUBLIC_IP }}
      EC2_SECURITY_GROUP_ID: ${{ vars.EC2_SECURITY_GROUP_ID }}
      STAGING_IMAGE: ghcr.io/devsanghavi/gitops-cicd-pipeline@${{ needs.build-and-push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Authorize temporary runner SSH access
        run: |
          RUNNER_IP="$(curl -fsS https://checkip.amazonaws.com)"
          echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"
          aws ec2 authorize-security-group-ingress --group-id "$EC2_SECURITY_GROUP_ID" --protocol tcp --port 22 --cidr "$RUNNER_IP/32"
      - name: Authorize EC2 Instance Connect key
        run: |
          ssh-keygen -t ed25519 -f staging-key -N ""
          aws ec2-instance-connect send-ssh-public-key --instance-id "$EC2_INSTANCE_ID" --instance-os-user ubuntu --ssh-public-key "file://staging-key.pub" --availability-zone us-east-1a
      - name: Copy deployment files
        run: |
          scp -i staging-key -o StrictHostKeyChecking=accept-new compose/staging.yml scripts/deploy-staging.sh ubuntu@"$EC2_PUBLIC_IP":/tmp/
          ssh -i staging-key -o StrictHostKeyChecking=accept-new ubuntu@"$EC2_PUBLIC_IP" 'mkdir -p ~/gitops-cicd-pipeline/compose ~/gitops-cicd-pipeline/scripts && mv /tmp/staging.yml ~/gitops-cicd-pipeline/compose/ && mv /tmp/deploy-staging.sh ~/gitops-cicd-pipeline/scripts/ && chmod +x ~/gitops-cicd-pipeline/scripts/deploy-staging.sh'
      - name: Deploy exact digest
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          printf 'STAGING_IMAGE=%s\nGHCR_USERNAME=%s\nGHCR_TOKEN=%s\n' "$STAGING_IMAGE" "$GHCR_USERNAME" "$GHCR_TOKEN" | ssh -i staging-key -o StrictHostKeyChecking=accept-new ubuntu@"$EC2_PUBLIC_IP" 'cat > /tmp/project2-staging.env && cd ~/gitops-cicd-pipeline && set -a && . /tmp/project2-staging.env && set +a && bash scripts/deploy-staging.sh && rm -f /tmp/project2-staging.env'
      - name: Verify public staging endpoint
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsS "http://$EC2_PUBLIC_IP:8080/health" | grep -q '"status":"ok"'; then
              echo "PASS: public staging /health"
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Revoke temporary SSH access
        if: always()
        run: aws ec2 revoke-security-group-ingress --group-id "$EC2_SECURITY_GROUP_ID" --protocol tcp --port 22 --cidr "$RUNNER_IP/32"

  notify-failure:
    name: Notify Pipeline Failure
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: failure()
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - run: |
          aws sns publish --topic-arn "${{ vars.SNS_TOPIC_ARN }}" --subject "Deployment failed: ${{ github.workflow }}" --message "Repository: ${{ github.repository }}\nWorkflow: ${{ github.workflow }}\nRun: ${{ github.server_url }}/{{ github.repository }}/actions/runs/${{ github.run_id }}\nBranch: ${{ github.ref_name }}\nResult: failure"
